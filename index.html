<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="theme-color" content="#2563eb">
<meta name="description" content="Campus Assistant - Assistant numérique pour étudiants">

<title>Campus Assistant</title>

<style>
/* =========================================================
   CAMPUS ASSISTANT
   VERSION MONOFICHIER - index.html
   ========================================================= */

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --secondary:#7c3aed;
    --success:#16a34a;
    --warning:#f59e0b;
    --danger:#dc2626;

    --bg:#f4f7fb;
    --surface:#ffffff;
    --surface-2:#f8fafc;

    --text:#172033;
    --muted:#64748b;
    --border:#e2e8f0;

    --shadow:0 10px 30px rgba(15,23,42,.08);
    --radius:18px;

    --sidebar-width:260px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    background:var(--bg);
    color:var(--text);

    min-height:100vh;

    transition:
        background .25s,
        color .25s;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================================================
   DARK MODE
   ========================================================= */

body.dark{
    --bg:#0b1120;
    --surface:#111827;
    --surface-2:#172033;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#263449;

    --shadow:0 10px 30px rgba(0,0,0,.25);
}

/* =========================================================
   GLOBAL
   ========================================================= */

.hidden{
    display:none!important;
}

.app{
    min-height:100vh;
}

/* =========================================================
   LOGIN
   ========================================================= */

.auth-screen{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at top left,
            rgba(37,99,235,.25),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(124,58,237,.2),
            transparent 35%
        ),
        var(--bg);
}

.auth-card{
    width:100%;
    max-width:460px;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:28px;

    padding:35px;

    box-shadow:var(--shadow);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-icon{
    width:48px;
    height:48px;

    display:grid;
    place-items:center;

    background:linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );

    color:white;

    border-radius:15px;

    font-size:24px;
}

.brand h1{
    font-size:22px;
}

.brand p{
    color:var(--muted);
    font-size:13px;
    margin-top:3px;
}

.auth-title{
    margin-top:30px;
    font-size:28px;
}

.auth-description{
    color:var(--muted);
    margin-top:8px;
    line-height:1.6;
}

.form-group{
    margin-top:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:600;
}

.input,
.textarea,
.select{
    width:100%;

    border:1px solid var(--border);

    background:var(--surface);

    color:var(--text);

    border-radius:12px;

    padding:13px 14px;

    outline:none;

    transition:.2s;
}

.input:focus,
.textarea:focus,
.select:focus{
    border-color:var(--primary);

    box-shadow:
        0 0 0 3px rgba(37,99,235,.12);
}

.textarea{
    resize:vertical;
    min-height:100px;
}

.primary-btn,
.secondary-btn,
.danger-btn,
.ghost-btn{
    border:none;
    border-radius:12px;
    padding:12px 16px;
    transition:.2s;
}

.primary-btn{
    color:white;
    background:var(--primary);
}

.primary-btn:hover{
    background:var(--primary-dark);
    transform:translateY(-1px);
}

.secondary-btn{
    color:white;
    background:var(--secondary);
}

.danger-btn{
    color:white;
    background:var(--danger);
}

.ghost-btn{
    color:var(--text);
    background:var(--surface-2);
    border:1px solid var(--border);
}

.full-btn{
    width:100%;
    margin-top:22px;
}

.demo-info{
    margin-top:18px;
    padding:13px;

    background:var(--surface-2);

    border:1px solid var(--border);

    border-radius:12px;

    font-size:13px;
    color:var(--muted);
}

/* =========================================================
   LAYOUT
   ========================================================= */

.app-layout{
    display:flex;
    min-height:100vh;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    position:fixed;

    left:0;
    top:0;
    bottom:0;

    width:var(--sidebar-width);

    background:var(--surface);

    border-right:1px solid var(--border);

    padding:22px 15px;

    z-index:100;

    display:flex;
    flex-direction:column;
}

.sidebar-brand{
    padding:5px 8px 25px;
}

.sidebar-brand .brand-icon{
    width:42px;
    height:42px;
    font-size:20px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.nav button{
    width:100%;

    display:flex;
    align-items:center;
    gap:12px;

    border:none;

    color:var(--muted);

    background:transparent;

    padding:12px 13px;

    border-radius:12px;

    text-align:left;

    transition:.2s;
}

.nav button:hover{
    background:var(--surface-2);
    color:var(--text);
}

.nav button.active{
    background:rgba(37,99,235,.1);
    color:var(--primary);
    font-weight:700;
}

.nav-icon{
    width:22px;
    text-align:center;
}

.sidebar-bottom{
    margin-top:auto;
}

.user-mini{
    display:flex;
    align-items:center;
    gap:10px;

    padding:12px;

    background:var(--surface-2);

    border-radius:14px;

    margin-bottom:10px;
}

.avatar{
    width:40px;
    height:40px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );

    color:white;

    font-weight:700;
}

.user-mini strong{
    display:block;
    font-size:14px;
}

.user-mini small{
    color:var(--muted);
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
    margin-left:var(--sidebar-width);

    width:calc(100% - var(--sidebar-width));

    min-height:100vh;
}

.topbar{
    height:74px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    background:var(--surface);

    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;

    z-index:50;
}

.mobile-menu{
    display:none;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    width:42px;
    height:42px;

    display:grid;
    place-items:center;

    border:1px solid var(--border);

    background:var(--surface);

    color:var(--text);

    border-radius:12px;
}

.content{
    padding:28px;

    max-width:1500px;

    margin:auto;
}

/* =========================================================
   PAGE HEADER
   ========================================================= */

.page-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;
}

.page-header h2{
    font-size:28px;
}

.page-header p{
    color:var(--muted);
    margin-top:5px;
}

.page-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

/* =========================================================
   DASHBOARD
   ========================================================= */

.welcome{
    background:
        linear-gradient(
            135deg,
            #1d4ed8,
            #7c3aed
        );

    color:white;

    padding:30px;

    border-radius:24px;

    position:relative;

    overflow:hidden;

    margin-bottom:22px;
}

.welcome:after{
    content:"";

    position:absolute;

    width:260px;
    height:260px;

    right:-80px;
    top:-100px;

    border-radius:50%;

    background:rgba(255,255,255,.1);
}

.welcome h2{
    font-size:28px;
    position:relative;
    z-index:1;
}

.welcome p{
    margin-top:7px;
    opacity:.85;
    position:relative;
    z-index:1;
}

.stats-grid{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:16px;

    margin-bottom:22px;
}

.stat-card{
    background:var(--surface);

    border:1px solid var(--border);

    border-radius:18px;

    padding:20px;

    box-shadow:var(--shadow);
}

.stat-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stat-icon{
    width:44px;
    height:44px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:rgba(37,99,235,.1);

    font-size:21px;
}

.stat-number{
    margin-top:15px;

    font-size:28px;
    font-weight:800;
}

.stat-label{
    color:var(--muted);

    font-size:13px;

    margin-top:3px;
}

.grid-2{
    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

    gap:20px;

    margin-bottom:22px;
}

.panel{
    background:var(--surface);

    border:1px solid var(--border);

    border-radius:18px;

    padding:20px;

    box-shadow:var(--shadow);
}

.panel-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:18px;
}

.panel-header h3{
    font-size:17px;
}

.panel-header button{
    border:none;

    color:var(--primary);

    background:transparent;

    font-size:13px;
}

/* =========================================================
   ITEMS
   ========================================================= */

.item-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.list-item{
    display:flex;

    align-items:center;

    gap:12px;

    padding:13px;

    border:1px solid var(--border);

    border-radius:13px;

    background:var(--surface-2);
}

.list-icon{
    width:40px;
    height:40px;

    flex:none;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:rgba(37,99,235,.1);
}

.list-main{
    min-width:0;
    flex:1;
}

.list-main strong{
    display:block;

    font-size:14px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.list-main small{
    color:var(--muted);

    display:block;

    margin-top:3px;
}

/* =========================================================
   CARDS
   ========================================================= */

.cards{
    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:16px;
}

.card{
    background:var(--surface);

    border:1px solid var(--border);

    border-radius:18px;

    padding:20px;

    box-shadow:var(--shadow);

    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
}

.card-icon{
    width:48px;
    height:48px;

    display:grid;
    place-items:center;

    border-radius:14px;

    background:rgba(37,99,235,.1);

    font-size:23px;

    margin-bottom:14px;
}

.card h3{
    font-size:17px;
}

.card p{
    color:var(--muted);

    line-height:1.55;

    margin-top:7px;

    font-size:14px;
}

.card-footer{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    margin-top:18px;
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-box{
    position:relative;

    max-width:480px;
}

.search-box input{
    padding-left:42px;
}

.search-symbol{
    position:absolute;

    left:14px;
    top:50%;

    transform:translateY(-50%);

    color:var(--muted);
}

/* =========================================================
   BADGES
   ========================================================= */

.badge{
    display:inline-flex;

    align-items:center;

    padding:5px 9px;

    border-radius:999px;

    font-size:11px;

    font-weight:700;
}

.badge-blue{
    color:#1d4ed8;
    background:#dbeafe;
}

.badge-green{
    color:#166534;
    background:#dcfce7;
}

.badge-yellow{
    color:#92400e;
    background:#fef3c7;
}

.badge-red{
    color:#991b1b;
    background:#fee2e2;
}

/* =========================================================
   PROGRESS
   ========================================================= */

.progress-wrap{
    margin-top:14px;
}

.progress-label{
    display:flex;

    justify-content:space-between;

    font-size:13px;

    margin-bottom:7px;
}

.progress-label span:last-child{
    color:var(--muted);
}

.progress{
    height:9px;

    background:var(--surface-2);

    border-radius:99px;

    overflow:hidden;
}

.progress-bar{
    height:100%;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

    border-radius:99px;
}

/* =========================================================
   TABLE
   ========================================================= */

.table-wrapper{
    width:100%;

    overflow-x:auto;

    border:1px solid var(--border);

    border-radius:15px;
}

table{
    width:100%;

    border-collapse:collapse;

    min-width:650px;
}

th,
td{
    padding:13px 15px;

    border-bottom:1px solid var(--border);

    text-align:left;

    font-size:13px;
}

th{
    color:var(--muted);

    font-weight:700;

    background:var(--surface-2);
}

tr:last-child td{
    border-bottom:none;
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty{
    text-align:center;

    padding:45px 20px;

    color:var(--muted);
}

.empty-icon{
    font-size:42px;

    margin-bottom:12px;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(15,23,42,.55);

    backdrop-filter:blur(4px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:1000;
}

.modal-card{
    width:100%;
    max-width:560px;

    max-height:90vh;

    overflow-y:auto;

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:22px;

    padding:25px;

    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:20px;
}

.close-btn{
    width:36px;
    height:36px;

    border:none;

    border-radius:10px;

    background:var(--surface-2);

    color:var(--text);

    font-size:20px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast-container{
    position:fixed;

    right:20px;
    bottom:20px;

    z-index:2000;

    display:flex;

    flex-direction:column;

    gap:10px;

    width:min(360px,calc(100% - 40px));
}

.toast{
    background:var(--surface);

    color:var(--text);

    border:1px solid var(--border);

    box-shadow:var(--shadow);

    border-radius:14px;

    padding:14px 16px;

    animation:
        toastIn .25s ease;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:1000px){

    .stats-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .cards{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}

@media(max-width:760px){

    .sidebar{
        transform:translateX(-100%);

        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .mobile-menu{
        display:grid;
    }

    .topbar{
        padding:0 15px;
    }

    .content{
        padding:18px 15px 90px;
    }

    .page-header{
        flex-direction:column;
    }

    .page-header h2{
        font-size:23px;
    }

    .grid-2{
        grid-template-columns:1fr;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .stats-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:10px;
    }

    .stat-card{
        padding:15px;
    }

    .stat-number{
        font-size:23px;
    }

    .welcome{
        padding:23px;
    }

    .welcome h2{
        font-size:23px;
    }

}

@media(max-width:420px){

    .stats-grid{
        grid-template-columns:1fr;
    }

    .topbar .search-box{
        display:none;
    }

    .auth-card{
        padding:25px 20px;
    }

}

/* =========================================================
   ADMIN
   ========================================================= */

.admin-warning{
    padding:13px 15px;

    border-radius:12px;

    background:#fef3c7;

    color:#92400e;

    margin-bottom:18px;

    font-size:13px;
}

.admin-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:18px;
}

@media(max-width:700px){
    .admin-grid{
        grid-template-columns:1fr;
    }
}

/* =========================================================
   CHAT
   ========================================================= */

.chat{
    display:flex;

    flex-direction:column;

    gap:12px;

    min-height:320px;
}

.chat-messages{
    flex:1;

    min-height:230px;

    max-height:400px;

    overflow-y:auto;

    display:flex;

    flex-direction:column;

    gap:10px;

    padding:5px;
}

.message{
    max-width:85%;

    padding:12px 14px;

    border-radius:15px;

    font-size:14px;

    line-height:1.5;
}

.message.ai{
    align-self:flex-start;

    background:var(--surface-2);

    border:1px solid var(--border);
}

.message.user{
    align-self:flex-end;

    color:white;

    background:var(--primary);
}

.chat-input{
    display:flex;

    gap:8px;
}

.chat-input input{
    flex:1;
}

/* =========================================================
   NOTIFICATION DOT
   ========================================================= */

.notification-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--danger);

    position:absolute;

    top:7px;
    right:7px;
}

.icon-relative{
    position:relative;
}

/* =========================================================
   PRINT
   ========================================================= */

@media print{

    .sidebar,
    .topbar,
    .page-actions,
    nav{
        display:none!important;
    }

    .main{
        margin:0;
        width:100%;
    }

    .content{
        padding:0;
    }

}
</style>
</head>

<body>

<!-- ========================================================
     APPLICATION
     ======================================================== -->

<div id="app"></div>

<div id="toastContainer" class="toast-container"></div>


<script>
/* =========================================================
   CAMPUS ASSISTANT
   JAVASCRIPT APPLICATION
   ========================================================= */

"use strict";

/* =========================================================
   UTILITIES
   ========================================================= */

const $ = (selector) => document.querySelector(selector);

const $$ = (selector) =>
    Array.from(document.querySelectorAll(selector));

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"
